name: Lagebild aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html app.js sw.js manifest.webmanifest icons config README.md .nojekyll _site/
          mkdir -p _site/data && cp static/*.json _site/data/
      - name: Daten sammeln
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tools/collect.mjs _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # GitHub meldet bei Störungen gelegentlich „Server error (500)“ – dann nach kurzer Pause ein zweiter Versuch
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
